[package]
name = "goose-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# Include 3rd-party licenses for JavaScript/CSS minified files
include = [
    "licenses/chart-js.license",
    "licenses/d3-js.license",
    "licenses/d3-sankey.license",
    "licenses/leaflet.license",
    "licenses/leaflet-markercluster.license",
    "licenses/mermaid.license"
]

[lints]
workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server", "client", "transport-io", "macros"] }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
shellexpand = { workspace = true }
indoc = { workspace = true }
xcap = { version = "=0.4.0", optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "system-proxy"], default-features = false }
chrono = { workspace = true }
etcetera = { workspace = true }
tempfile = { workspace = true }
include_dir = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
ignore = { workspace = true }
lopdf = { version = "0.36.0", optional = true }
docx-rs = { version = "0.4.7", optional = true }
image = { version = "0.24.9", features = ["jpeg"], optional = true }
umya-spreadsheet = { version = "2.2.3", optional = true }
which = {workspace = true}
lru = { workspace = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
rayon = { version = "1.10", optional = true }
libc = "0.2"
# TODO: Fork mpatch or replace with a custom implementation using `similar` crate
# for fuzzy patch matching. Current crate has limited maintenance (single maintainer,
# ~1000 downloads). Pinned to exact version to prevent supply chain attacks.
mpatch = "=0.2.0"
tokio-util = { workspace = true }
shell-words = "1.1.1"

[dev-dependencies]
serial_test = { workspace = true }

[features]
default = ["builtin-all"]
builtin-all = [
    "builtin-developer",
    "builtin-developer-analyze",
    "builtin-developer-vision",
    "builtin-autovisualiser",
    "builtin-computercontroller",
    "builtin-memory",
    "builtin-tutorial",
]
lite = ["builtin-developer", "builtin-developer-analyze"]
builtin-developer = []
builtin-developer-analyze = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-ruby",
    "dep:rayon",
]
builtin-developer-vision = ["dep:xcap", "dep:image"]
builtin-autovisualiser = []
builtin-computercontroller = [
    "dep:lopdf",
    "dep:docx-rs",
    "dep:umya-spreadsheet",
    "dep:image",
]
builtin-memory = []
builtin-tutorial = []
